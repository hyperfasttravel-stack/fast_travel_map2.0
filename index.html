<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Travel | Карта маршрутов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #1a1a1a; filter: brightness(1.3) contrast(1.2) saturate(1.1); }
        
        /* Кластеры */
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(0, 212, 255, 0.6) !important; border: 2px solid #fff !important; }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: #1a1a1a !important; color: #00d4ff !important; font-weight: bold; }
        
        /* Десктопный попап */
        .leaflet-popup-content-wrapper { background-color: #2a2a2a; color: #e0e0e0; border-radius: 12px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); padding: 0; }
        .leaflet-popup-tip { background-color: #2a2a2a; }
        .leaflet-popup-content { max-width: 310px; margin: 0; padding: 0; }
        
        /* Карточка контента (ПК и шторка) */
        .card-content { padding: 15px; font-size: 14px; line-height: 1.5; color: #e0e0e0; }
        .card-content b { color: #00d4ff; font-size: 17px; display: block; margin-bottom: 4px; padding-right: 25px; }
        .card-coords { font-size: 12px; color: #999; margin-bottom: 8px; font-family: monospace; }
        .card-desc { margin-bottom: 10px; white-space: pre-line; }
        
        /* Галерея */
        .popup-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
        .popup-gallery.single-photo { grid-template-columns: 1fr; }
        .popup-gallery a { display: block; width: 100%; aspect-ratio: 16/10; overflow: hidden; border-radius: 8px; cursor: pointer; background: #1a1a1a; }
        .popup-gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
        .popup-gallery img:hover { transform: scale(1.03); }

        /* Кнопки действий в карточке */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
        .action-btn { background-color: #1a1a1a; color: #00d4ff; border: 1px solid #00d4ff; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s; }
        .action-btn:hover { background-color: rgba(0, 212, 255, 0.15); }
        .action-btn.full-width { grid-column: 1 / -1; }
        
        .admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3a; }
        .edit-btn { background-color: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; padding: 7px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .edit-btn:hover { background-color: #ffc107; color: #1a1a1a; }
        .delete-btn { background-color: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; padding: 7px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .delete-btn:hover { background-color: #ff4d4d; color: white; }

        /* Мобильная выдвижная шторка */
        #bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; height: 85vh;
            background-color: #242424; border-top: 1px solid #444;
            border-radius: 20px 20px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.85);
            z-index: 2500; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column;
        }
        #bottom-sheet.half { transform: translateY(42vh); }
        #bottom-sheet.full { transform: translateY(0); }
        #sheet-drag-zone { padding: 12px 0 8px 0; touch-action: none; display: flex; justify-content: center; align-items: center; position: relative; flex-shrink: 0; cursor: grab; }
        #sheet-handle { width: 42px; height: 5px; background-color: #666; border-radius: 3px; }
        #sheet-close-btn { position: absolute; right: 15px; top: 8px; background: #333; border: none; color: #aaa; width: 28px; height: 28px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #sheet-body { overflow-y: auto; padding: 0 18px 40px 18px; flex-grow: 1; overscroll-behavior: contain; }
        @media (min-width: 769px) { #bottom-sheet { display: none !important; } }

        /* Боковое меню */
        #menu-btn { position: fixed; top: 15px; left: 15px; z-index: 3000; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 8px; padding: 8px 12px; font-size: 20px; cursor: pointer; }
        #sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background-color: #2a2a2a; color: white; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.8); z-index: 2900; padding: 60px 20px 20px 20px; box-sizing: border-box; transition: left 0.3s ease-in-out; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        #sidebar h2 { font-size: 18px; margin-top: 0; margin-bottom: 5px; color: #00d4ff; }
        #location-count { font-size: 13px; color: #a0a0a0; margin-bottom: 10px; }
        #search-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; margin-bottom: 15px; box-sizing: border-box; }
        #location-list { flex-grow: 1; overflow-y: auto; }
        .location-item { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
        .location-item:hover { background-color: #333; }
        .location-item strong { display: block; font-size: 14px; color: #e0e0e0; }
        .location-item span { font-size: 11px; color: #00d4ff; }
        .role-box { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; font-size: 12px; color: #aaa; }
        .role-btn { width: 100%; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid #00d4ff; background: #1a1a1a; color: #00d4ff; cursor: pointer; font-weight: bold; }

        /* Плавающие кнопки справа */
        .fab-group { position: fixed; bottom: 25px; right: 20px; z-index: 2001; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .fab-btn { border-radius: 50%; width: 54px; height: 54px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; border: none; transition: 0.2s; }
        #locate-btn { background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; }
        #add-line-btn { background-color: #2a2a2a; color: #ffc107; border: 2px solid #ffc107; display: none; }
        #add-point-btn { background-color: #00d4ff; color: #1a1a1a; font-size: 28px; display: none; }

        /* Форма точки */
        #add-form { position: fixed; bottom: 95px; right: 20px; z-index: 2600; background-color: #2a2a2a; padding: 15px; border-radius: 12px; border: 1px solid #00d4ff; display: none; flex-direction: column; width: 270px; box-shadow: 0 4px 20px rgba(0,0,0,0.9); max-height: 75vh; overflow-y: auto; }
        #add-form.open { display: flex; }
        @media (max-width: 768px) { #add-form { right: 10px; left: 10px; width: auto; bottom: 90px; } }
        #add-form input, #add-form select, #add-form textarea { margin-bottom: 10px; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; font-family: inherit; }
        .file-label { background-color: #1a1a1a; border: 1px dashed #00d4ff; color: #00d4ff; padding: 8px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; margin-bottom: 8px; display: block; }
        #file-count { font-size: 11px; color: #aaa; margin-bottom: 10px; text-align: center; }
        .form-btn-primary { background-color: #00d4ff; color: #1a1a1a; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .form-btn-cancel { background-color: #444; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; margin-top: 6px; }

        /* Выдвижная/сворачиваемая нижняя панель для ЛИНИЙ (чтобы не мешала на телефоне) */
        #line-drawer {
            position: fixed; left: 0; right: 0; bottom: 0;
            background-color: #242424; border-top: 2px solid #ffc107;
            border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.85);
            z-index: 2700; padding: 10px 15px 20px 15px;
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
        }
        #line-drawer.open { transform: translateY(0); }
        #line-drawer.minimized { transform: translateY(calc(100% - 48px)); }
        .line-drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; min-height: 28px; }
        .line-drawer-title { color: #ffc107; font-weight: bold; font-size: 14px; }
        .line-toggle-btn { background: #333; color: #ffc107; border: 1px solid #555; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        .line-controls-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .line-controls-row input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 13px; }
        .line-tool-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #333; color: white; font-size: 12px; cursor: pointer; font-weight: bold; }
        .line-save-btn { flex: 1.5; padding: 9px; border-radius: 6px; border: none; background: #ffc107; color: #1a1a1a; font-weight: bold; font-size: 13px; cursor: pointer; }

        /* Маркер узла при редактировании линии */
        .vertex-handle { width: 16px; height: 16px; background: #ffc107; border: 2px solid #1a1a1a; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.8); cursor: move; }
        .vertex-mid-handle { width: 12px; height: 12px; background: rgba(255, 193, 7, 0.5); border: 1px solid #fff; border-radius: 50%; cursor: pointer; }

        /* Модалка входа */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #auth-modal.hidden { display: none; }
        .auth-card { background: #2a2a2a; border: 1px solid #00d4ff; border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .auth-card h3 { margin-top: 0; color: #00d4ff; font-size: 20px; }
        .auth-card p { font-size: 13px; color: #bbb; margin-bottom: 18px; }
        .auth-btn-guest { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00d4ff; color: #1a1a1a; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
        .auth-btn-admin-toggle { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555; background: transparent; color: #ccc; font-size: 13px; cursor: pointer; }
        #admin-login-fields { display: none; flex-direction: column; margin-top: 15px; text-align: left; }
        #admin-login-fields input { margin-bottom: 10px; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #2a2a2a; color: #00d4ff; padding: 10px 20px; border-radius: 8px; border: 1px solid #00d4ff; z-index: 6000; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; text-align: center; font-size: 14px; max-width: 85%; }
        .leaflet-control-layers { background-color: #2a2a2a !important; color: white !important; border-radius: 8px; border: 1px solid #444 !important; }
        .leaflet-control-layers label { color: #e0e0e0; }
    </style>
</head>
<body>

    <!-- Стартовое окно выбора роли -->
    <div id="auth-modal">
        <div class="auth-card">
            <h3>Fast Travel Map</h3>
            <p>Выберите режим работы с картой</p>
            <button class="auth-btn-guest" id="enter-guest-btn">Обычный пользователь (Просмотр)</button>
            <button class="auth-btn-admin-toggle" id="show-admin-login-btn">Войти как Админ</button>
            <div id="admin-login-fields">
                <input type="email" id="admin-email" placeholder="Email админа">
                <input type="password" id="admin-pass" placeholder="Пароль">
                <button class="auth-btn-guest" id="admin-submit-btn">Войти в панель Админа</button>
            </div>
        </div>
    </div>

    <button id="menu-btn">☰</button>
    <div id="sidebar">
        <h2>Маршруты и точки</h2>
        <input type="text" id="search-input" placeholder="Поиск по названию...">
        <div id="location-count">Загрузка...</div>
        <div id="location-list"></div>
        <div class="role-box">
            <div id="role-status">Режим: Просмотр</div>
            <button class="role-btn" id="switch-role-btn">Сменить роль / Войти</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Выдвижная мобильная шторка для точек и маршрутов -->
    <div id="bottom-sheet">
        <div id="sheet-drag-zone">
            <div id="sheet-handle"></div>
            <button id="sheet-close-btn">×</button>
        </div>
        <div id="sheet-body"></div>
    </div>

    <!-- Плавающие кнопки -->
    <div class="fab-group">
        <button class="fab-btn" id="locate-btn" title="Моё местоположение">🎯</button>
        <button class="fab-btn" id="add-line-btn" title="Нарисовать маршрут">〰️</button>
        <button class="fab-btn" id="add-point-btn" title="Добавить точку">+</button>
    </div>

    <!-- Форма создания / редактирования точки -->
    <div id="add-form">
        <b id="form-title" style="color:#00d4ff; margin-bottom:6px;">Добавить точку</b>
        <p id="coords-hint" style="font-size:12px; color:#aaa; margin:0 0 10px 0;">Кликни по карте, чтобы поставить пин</p>
        <input type="text" id="form-name" placeholder="Название" required>
        <textarea id="form-desc" placeholder="Описание" rows="2"></textarea>
        <label class="file-label" for="form-files">📷 Выбрать фото с устройства</label>
        <input type="file" id="form-files" accept="image/*" multiple style="display:none;">
        <div id="file-count">Файлы не выбраны</div>
        <input type="text" id="form-images" placeholder="Или ссылки на фото через запятую">
        <select id="form-layer">
            <option value="Самара">Самара</option>
            <option value="Питер">Питер</option>
            <option value="Другое">Другое</option>
        </select>
        <button class="form-btn-primary" id="form-save">Сохранить точку</button>
        <button class="form-btn-cancel" id="form-cancel">Отмена</button>
    </div>

    <!-- Выдвижная нижняя панель для рисования и редактирования ЛИНИЙ -->
    <div id="line-drawer">
        <div class="line-drawer-header" id="line-drawer-toggle">
            <span class="line-drawer-title" id="line-drawer-title">Новый маршрут (точек: 0)</span>
            <button class="line-toggle-btn" id="line-toggle-text">Свернуть ▾</button>
        </div>
        <div id="line-drawer-content">
            <div class="line-controls-row">
                <input type="text" id="line-name" placeholder="Название маршрута (необязательно)">
            </div>
            <div class="line-controls-row">
                <button class="line-tool-btn" id="line-undo-btn">↩ Шаг назад</button>
                <button class="line-tool-btn" id="line-clear-btn">🗑 Очистить</button>
            </div>
            <div class="line-controls-row" style="margin-bottom:0;">
                <button class="line-save-btn" id="line-save-btn">Сохранить маршрут</button>
                <button class="line-tool-btn" id="line-cancel-btn" style="flex:0.8;">Отмена</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        window.PhotoSwipeLightbox = PhotoSwipeLightbox;
        window.pswpModule = () => import('https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js');
    </script>

    <script>
        var map = L.map('map', { zoomControl: false }).setView(L.latLng(53.195873, 50.100193), 10);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png?api_key=9fc223d0-2456-4c9d-923d-08dc9822ebc1', {
            attribution: '&copy; Stadia Maps',
            maxZoom: 20,
            keepBuffer: 4
        }).addTo(map);

        const SUPABASE_URL = 'https://rawcofbihkxhzxnuhksr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-IcL5KI7zFxj4IOQom6nDQ_q9UVr77T';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var isAdmin = false;
        var allLocationsData = {};
        var allPoints = [];
        var markerStore = {};
        var lineStore = {};
        var userLocationMarker = null;
        var userAccuracyCircle = null;
        var tempDraftMarker = null;
        var editingPointId = null;

        /* Белая подсветка у иконок точек */
        var customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<img src="logo.png" style="width: 56px; height: auto; filter: drop-shadow(0px 0px 10px rgba(255, 255, 255, 0.95));" />`,
            iconSize: L.point(56, 56),
            iconAnchor: L.point(28, 28),
            popupAnchor: L.point(0, -28)
        });

        var clusterGroups = {
            "Самара": L.markerClusterGroup({ maxClusterRadius: 50 }).addTo(map),
            "Питер": L.markerClusterGroup({ maxClusterRadius: 50 }),
            "Другое": L.markerClusterGroup({ maxClusterRadius: 50 })
        };
        var lineLayer = L.layerGroup().addTo(map);
        var layers = {
            "Самара": clusterGroups["Самара"],
            "Питер": clusterGroups["Питер"],
            "Другое": clusterGroups["Другое"],
            "Маршруты (Линии)": lineLayer
        };

        function isMobile() { return window.innerWidth <= 768; }

        function showToast(message, isError = false) {
            var toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.color = isError ? '#ff4d4d' : '#00d4ff';
            toast.style.borderColor = isError ? '#ff4d4d' : '#00d4ff';
            toast.style.display = 'block';
            clearTimeout(toast.timer);
            toast.timer = setTimeout(function() { toast.style.display = 'none'; }, 3200);
        }

        /* Копирование текста (координат или ссылки) */
        window.copyText = function(text, label) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast(label || 'Скопировано!');
                }).catch(function() {
                    fallbackCopy(text, label);
                });
            } else {
                fallbackCopy(text, label);
            }
        };

        function fallbackCopy(text, label) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast(label || 'Скопировано!');
            } catch (e) {
                showToast('Не удалось скопировать', true);
            }
            document.body.removeChild(ta);
        }

        /* Разбор массива картинок с защитой от запятых внутри base64 */
        function parseImageUrls(rawStr) {
            if (!rawStr || typeof rawStr !== 'string' || rawStr.trim() === '') return [];
            var parts = rawStr.split(',');
            var result = [];
            for (var i = 0; i < parts.length; i++) {
                var part = parts[i].trim();
                if (!part) continue;
                if (part.startsWith('data:image') && i + 1 < parts.length) {
                    result.push(part + ',' + parts[i + 1].trim());
                    i++;
                } else {
                    result.push(part);
                }
            }
            return result;
        }

        /* --- АВТОРИЗАЦИЯ И РОЛИ --- */
        function applyRoleUI() {
            document.getElementById('add-point-btn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('add-line-btn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('role-status').innerText = isAdmin ? 'Роль: Админ (полный доступ)' : 'Роль: Гость (только просмотр)';
            document.getElementById('switch-role-btn').innerText = isAdmin ? 'Выйти из Админа' : 'Войти как Админ';
        }

        async function checkInitialAuth() {
            const { data } = await db.auth.getSession();
            if (data && data.session) {
                isAdmin = true;
                document.getElementById('auth-modal').classList.add('hidden');
                applyRoleUI();
                loadData();
            } else {
                isAdmin = false;
                applyRoleUI();
            }
        }

        document.getElementById('enter-guest-btn').addEventListener('click', function() {
            isAdmin = false;
            document.getElementById('auth-modal').classList.add('hidden');
            applyRoleUI();
            loadData();
        });

        document.getElementById('show-admin-login-btn').addEventListener('click', function() {

        /* --- ВЫДВИЖНАЯ ШТОРКА (BOTTOM SHEET) --- */
        const sheet = document.getElementById('bottom-sheet');
        const sheetBody = document.getElementById('sheet-body');
        const dragZone = document.getElementById('sheet-drag-zone');
        let startY = 0, currentY = 0, isDragging = false;

        function openBottomSheet(htmlContent) {
            sheetBody.innerHTML = htmlContent;
            sheetBody.scrollTop = 0;
            sheet.classList.remove('full');
            sheet.classList.add('half');
            updatePhotoSizes();
        }
        function closeBottomSheet() { sheet.classList.remove('half', 'full'); }
        document.getElementById('sheet-close-btn').addEventListener('click', closeBottomSheet);

        map.on('click', function() {
            if (!document.getElementById('add-form').classList.contains('open') && !isDrawingLine) {
                closeBottomSheet();
            }
        });

        dragZone.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length > 0) {
                startY = e.touches.item(0).clientY;
                isDragging = true;
                sheet.style.transition = 'none';
            }
        }, { passive: true });

        dragZone.addEventListener('touchmove', function(e) {
            if (!isDragging || !e.touches || e.touches.length === 0) return;
            currentY = e.touches.item(0).clientY;
            const deltaY = currentY - startY;
            const baseOffset = sheet.classList.contains('full') ? 0 : window.innerHeight * 0.42;
            sheet.style.transform = `translateY(${Math.max(0, baseOffset + deltaY)}px)`;
        }, { passive: true });

        dragZone.addEventListener('touchend', function() {
            if (!isDragging) return;
            isDragging = false;
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            sheet.style.transform = '';
            const deltaY = currentY - startY;
            if (Math.abs(deltaY) < 20) return;
            if (deltaY < -50) { sheet.classList.remove('half'); sheet.classList.add('full'); }
            else if (deltaY > 50) {
                if (sheet.classList.contains('full')) { sheet.classList.remove('full'); sheet.classList.add('half'); }
                else closeBottomSheet();
            }
            startY = 0; currentY = 0;
        });

        /* --- ЛУПА (PHOTOSWIPE 5) --- */
        function updatePhotoSizes() {
            document.querySelectorAll('.popup-gallery a').forEach(function(link) {
                const img = new Image();
                img.onload = function() {
                    link.setAttribute('data-pswp-width', this.naturalWidth);
                    link.setAttribute('data-pswp-height', this.naturalHeight);
                };
                img.src = link.getAttribute('href');
            });
        }

        document.addEventListener('click', function(e) {
            const link = e.target.closest('.popup-gallery a');
            if (!link) return;
            e.preventDefault();
            e.stopPropagation();

            const gallery = link.closest('.popup-gallery');
            const links = Array.from(gallery.querySelectorAll('a'));
            const dataSource = links.map(function(a) {
                const img = a.querySelector('img');
                return {
                    src: a.getAttribute('href'),
                    w: parseInt(a.getAttribute('data-pswp-width')) || (img && img.naturalWidth) || 1200,
                    h: parseInt(a.getAttribute('data-pswp-height')) || (img && img.naturalHeight) || 900
                };
            });

            if (window.PhotoSwipeLightbox && window.pswpModule) {
                const lightbox = new window.PhotoSwipeLightbox({
                    dataSource: dataSource,
                    pswpModule: window.pswpModule,
                    showHideAnimationType: 'fade',
                    closeOnVerticalDrag: true
                });
                lightbox.init();
                lightbox.loadAndOpen(links.indexOf(link));
            }
        });

        /* --- ЗАГРУЗКА ДАННЫХ И ПОСТРОЕНИЕ КАРТОЧЕК --- */
        function buildPointCardHtml(loc) {
            var urls = parseImageUrls(loc.image_url);
            var imageHtml = '';
            if (urls.length > 0) {
                var singleClass = urls.length === 1 ? ' single-photo' : '';
                imageHtml = `<div class="popup-gallery${singleClass}">`;
                urls.forEach(function(url) {
                    imageHtml += `<a href="${url}" data-pswp-width="1200" data-pswp-height="900"><img src="${url}" alt="Фото" loading="lazy"></a>`;
                });
                imageHtml += '</div>';
            }

            var coordsStr = `${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}`;
            var shareUrl = `${window.location.origin}${window.location.pathname}?point=${loc.id}`;
            var yandexUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;

            var adminHtml = '';
            if (isAdmin) {
                adminHtml = `
                    <div class="admin-actions">
                        <button class="edit-btn" onclick="startEditPoint(${loc.id})">✏️ Изменить</button>
                        <button class="delete-btn" onclick="deletePoint(${loc.id})">🗑 Удалить</button>
                    </div>
                `;
            }

            return `
                <div class="card-content">
                    <b>${loc.name}</b>
                    <div class="card-coords">${coordsStr}</div>
                    <div class="card-desc">${loc.description || 'Без описания'}</div>
                    ${imageHtml}
                    <div class="action-grid">
                        <button class="action-btn" onclick="copyText('${coordsStr}', 'Координаты скопированы!')">📋 Координаты</button>
                        <button class="action-btn" onclick="copyText('${shareUrl}', 'Ссылка на точку скопирована!')">🔗 Поделиться</button>
                        <a class="action-btn full-width" href="${yandexUrl}" target="_blank" rel="noopener">🧭 Маршрут в Яндекс.Картах</a>
                    </div>
                    ${adminHtml}
                </div>
            `;
        }

        function buildLineCardHtml(loc) {
            var adminHtml = '';
            if (isAdmin) {
                adminHtml = `
                    <div class="admin-actions">
                        <button class="edit-btn" onclick="startEditLine(${loc.id})">✏️ Изменить линию</button>
                        <button class="delete-btn" onclick="deletePoint(${loc.id})">🗑 Удалить</button>
                    </div>

            }
            return `
                <div class="card-content">
                    <b>${loc.name || 'Маршрут'}</b>

                </div>
            `;
        }

        async function loadData() {
            try {
                const { data, error } = await db.from('locations').select('*');
                if (error) throw error;

                Object.values(clusterGroups).forEach(function(g) { g.clearLayers(); });
                lineLayer.clearLayers();
                document.getElementById('location-list').innerHTML = '';
                allLocationsData = {};
                allPoints = [];
                markerStore = {};
                lineStore = {};
                var count = 0;

                data.forEach(function(loc) {
                    allLocationsData[loc.id] = loc;

                    if (loc.geometry_type === 'LineString') {
                        try {
                            var coords = typeof loc.coordinates === 'string' ? JSON.parse(loc.coordinates) : loc.coordinates;
                            loc.coordinates = coords;
                            if (Array.isArray(coords) && coords.length > 0) {
                                var poly = L.polyline(coords, { color: '#ffffff', weight: 2.5, opacity: 0.85, lineJoin: 'round' }).addTo(lineLayer);
                                poly.on('click', function(e) {
                                    if (isDrawingLine) return;
                                    L.DomEvent.stopPropagation(e);
                                    var lHtml = buildLineCardHtml(loc);
                                    if (isMobile()) {
                                        openBottomSheet(lHtml);
                                    } else {
                                        poly.bindPopup(lHtml).openPopup(e.latlng);
                                    }
                                });
                                lineStore[loc.id] = poly;
                                count++;
                            }
                        } catch(e) {}
                        return;
                    }

                    var cardHtml = buildPointCardHtml(loc);
                    var marker = L.marker(L.latLng(loc.lat, loc.lng), { icon: customIcon });

                    marker.on('click', function(e) {
                        if (isDrawingLine) return;
                        L.DomEvent.stopPropagation(e);
                        var freshHtml = buildPointCardHtml(allLocationsData[loc.id]);
                        if (isMobile()) {
                            openBottomSheet(freshHtml);
                            const targetPoint = map.project(L.latLng(loc.lat, loc.lng), map.getZoom());
                            targetPoint.y += window.innerHeight * 0.18;
                            map.panTo(map.unproject(targetPoint, map.getZoom()), { animate: true });
                        } else {
                            marker.unbindPopup();
                            marker.bindPopup(freshHtml).openPopup();
                            setTimeout(updatePhotoSizes, 50);
                        }
                    });

                    markerStore[loc.id] = marker;
                    var layerName = loc.layer ? loc.layer.trim().toLowerCase() : '';
                    var targetGroupKey = "Другое";
                    if (layerName.includes('питер') || layerName.includes('piter')) targetGroupKey = "Питер";
                    else if (layerName.includes('самара') || layerName.includes('samara')) targetGroupKey = "Самара";

                    clusterGroups[targetGroupKey].addLayer(marker);
                    allPoints.push({ id: loc.id, name: loc.name, layer: targetGroupKey, lat: loc.lat, lng: loc.lng, marker: marker, group: clusterGroups[targetGroupKey] });
                    count++;
                });

                document.getElementById('location-count').innerText = `Объектов на карте: ${count}`;
                allPoints.sort(function(a, b) { return a.name.localeCompare(b.name); });
                renderList(allPoints);
                openSharedPointIfPresent();
            } catch (err) {
                document.getElementById('location-list').innerHTML = "<p style='color:red;'>Ошибка загрузки данных</p>";
            }
        }

        function openSharedPointIfPresent() {
            var params = new URLSearchParams(window.location.search);
            var pointId = params.get('point');
            if (pointId && markerStore[pointId]) {
                var target = allPoints.find(function(p) { return String(p.id) === String(pointId); });
                if (target) {
                    if (!map.hasLayer(target.group)) map.addLayer(target.group);
                    target.group.zoomToShowLayer(target.marker, function() {
                        target.marker.fire('click');
                    });
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        /* --- ГЕОЛОКАЦИЯ GPS --- */
        document.getElementById('locate-btn').addEventListener('click', function() {
            if (!navigator.geolocation) { showToast('Браузер не поддерживает геолокацию', true); return; }

                    }

        function compressImage(file) {
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var maxDim = 1280;
                        var w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                            else { w = Math.round(w * maxDim / h); h = maxDim; }
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) {
                            resolve({ blob: blob, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        /* --- ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ ТОЧЕК --- */
        var newLat = 0, newLng = 0;

        function setDraftPoint(latlng) {
            newLat = latlng.lat; newLng = latlng.lng;
            document.getElementById('coords-hint').innerText = `Координаты: ${newLat.toFixed(5)}, ${newLng.toFixed(5)} (пин можно двигать)`;
            if (!tempDraftMarker) {
                tempDraftMarker = L.marker(latlng, { draggable: true }).addTo(map);
                tempDraftMarker.on('dragend', function(ev) {
                    var pos = ev.target.getLatLng();
                    newLat = pos.lat; newLng = pos.lng;
                    document.getElementById('coords-hint').innerText = `Координаты: ${newLat.toFixed(5)}, ${newLng.toFixed(5)}`;
                });
            } else {
                tempDraftMarker.setLatLng(latlng);
            }
        }

        function onMapClickForPoint(e) { setDraftPoint(e.latlng); }

        function closeAddForm() {

        window.startEditPoint = function(id) {

            map.closePopup();

            editingPointId = id;

        document.getElementById('form-save').addEventListener('click', async function() {
            var name = document.getElementById('form-name').value.trim();
            var desc = document.getElementById('form-desc').value.trim();
            var manualUrls = document.getElementById('form-images').value.trim();
            var layer = document.getElementById('form-layer').value;
            var fileInput = document.getElementById('form-files');
            var saveBtn = document.getElementById('form-save');

            if (!name || newLat === 0) { showToast('Введи название и выбери место на карте!', true); return; }

            saveBtn.disabled = true;
            saveBtn.innerText = 'Сохранение...';
            var finalUrls = parseImageUrls(manualUrls);

            if (fileInput.files && fileInput.files.length > 0) {
                for (var i = 0; i < fileInput.files.length; i++) {
                    var compressed = await compressImage(fileInput.files.item(i));
                    var fileName = `${Date.now()}_${i}.jpg`;
                    const { error: uploadErr } = await db.storage.from('photos').upload(fileName, compressed.blob, { contentType: 'image/jpeg' });
                    if (!uploadErr) {
                        const { data: pubData } = db.storage.from('photos').getPublicUrl(fileName);
                        finalUrls.push(pubData.publicUrl);
                    } else {
                        finalUrls.push(compressed.dataUrl);
                    }
                }
            }

            var payload = {
                name: name,
                description: desc,
                image_url: finalUrls.join(', '),
                lat: newLat,
                lng: newLng,
                layer: layer,
                geometry_type: 'Point',
                coordinates: '[]'
            };

            var dbRes = editingPointId
                ? await db.from('locations').update(payload).eq('id', editingPointId)
                : await db.from('locations').insert([payload]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'Сохранить точку';

            if (dbRes.error) {
                showToast('Ошибка: ' + dbRes.error.message, true);
            } else {
                showToast(editingPointId ? 'Точка обновлена!' : 'Точка добавлена!');
                closeAddForm();
                loadData();
            }
        });

        /* --- ВЫДВИЖНАЯ ПАНЕЛЬ РИСОВАНИЯ И РЕДАКТИРОВАНИЯ ЛИНИЙ --- */
        var isDrawingLine = false;
        var editingLineId = null;
        var draftLineCoords = [];
        var draftPolyline = null;
        var vertexLayer = L.layerGroup().addTo(map);

        const lineDrawer = document.getElementById('line-drawer');
        const lineToggleText = document.getElementById('line-toggle-text');

        document.getElementById('line-drawer-toggle').addEventListener('click', function() {
            lineDrawer.classList.toggle('minimized');
            lineToggleText.innerText = lineDrawer.classList.contains('minimized') ? 'Развернуть ▴' : 'Свернуть ▾';
        });

        function updateLineDrawerHeader() {
            var prefix = editingLineId ? 'Редактирование маршрута' : 'Новый маршрут';
            document.getElementById('line-drawer-title').innerText = `${prefix} (точек: ${draftLineCoords.length})`;
        }

        function renderEditableVertices() {
            vertexLayer.clearLayers();
            if (!draftPolyline) {
                draftPolyline = L.polyline(draftLineCoords, { color: '#ffc107', weight: 3, dashArray: '6, 6' }).addTo(map);
            } else {
                draftPolyline.setLatLngs(draftLineCoords);
            }

            draftLineCoords.forEach(function(coord, idx) {
                var vIcon = L.divIcon({ className: 'vertex-handle', iconSize: [16, 16], iconAnchor: [8, 8] });
                var vMarker = L.marker(coord, { icon: vIcon, draggable: true }).addTo(vertexLayer);
                
                vMarker.on('drag', function(ev) {
                    var pos = ev.target.getLatLng();
                    draftLineCoords[idx] = [pos.lat, pos.lng];
                    draftPolyline.setLatLngs(draftLineCoords);
                });
                vMarker.on('dragend', function() {
                    renderEditableVertices();
                });
                vMarker.on('click', function(ev) {
                    L.DomEvent.stopPropagation(ev);
                    if (draftLineCoords.length > 2) {
                        draftLineCoords.splice(idx, 1);
                        updateLineDrawerHeader();
                        renderEditableVertices();
                        showToast('Узел удалён');
                    }
                });

                // Промежуточный плюсик между узлами для вставки точки при редактировании
                if (idx < draftLineCoords.length - 1) {
                    var nextCoord = draftLineCoords[idx + 1];
                    var midLat = (coord[0] + nextCoord[0]) / 2;
                    var midLng = (coord[1] + nextCoord[1]) / 2;
                    var midIcon = L.divIcon({ className: 'vertex-mid-handle', iconSize: [12, 12], iconAnchor: [6, 6] });
                    var midMarker = L.marker([midLat, midLng], { icon: midIcon }).addTo(vertexLayer);
                    midMarker.on('click', function(ev) {
                        L.DomEvent.stopPropagation(ev);
                        draftLineCoords.splice(idx + 1, 0, [midLat, midLng]);
                        updateLineDrawerHeader();
                        renderEditableVertices();
                    });
                }
            });
        }

        function onMapClickForLine(e) {
            draftLineCoords.push([e.latlng.lat, e.latlng.lng]);
            updateLineDrawerHeader();
            renderEditableVertices();
        }

        function cancelLineMode() {
            isDrawingLine = false;
            editingLineId = null;
            draftLineCoords = [];
            map.off('click', onMapClickForLine);
            if (draftPolyline) { map.removeLayer(draftPolyline); draftPolyline = null; }
            vertexLayer.clearLayers();
            lineDrawer.classList.remove('open', 'minimized');
            lineToggleText.innerText = 'Свернуть ▾';
            document.getElementById('line-name').value = '';
        }

        document.getElementById('add-line-btn').addEventListener('click', function() {
            if (isDrawingLine) {
                cancelLineMode();
                return;
            }
            closeAddForm();
            closeBottomSheet();
            map.closePopup();

            isDrawingLine = true;
            editingLineId = null;
            draftLineCoords = [];
            updateLineDrawerHeader();
            lineDrawer.classList.remove('minimized');
            lineDrawer.classList.add('open');
            map.on('click', onMapClickForLine);
            showToast('Кликайте по карте для прокладки маршрута');
        });

        window.startEditLine = function(id) {
            var loc = allLocationsData[id];
            if (!loc || !Array.isArray(loc.coordinates)) return;
            closeAddForm();
            closeBottomSheet();
            map.closePopup();

            if (lineStore[id]) lineLayer.removeLayer(lineStore[id]);

            isDrawingLine = true;
            editingLineId = id;
            draftLineCoords = JSON.parse(JSON.stringify(loc.coordinates));
            document.getElementById('line-name').value = loc.name || '';
            updateLineDrawerHeader();
            renderEditableVertices();

            lineDrawer.classList.remove('minimized');
            lineDrawer.classList.add('open');
            map.on('click', onMapClickForLine);
            showToast('Двигайте жёлтые точки или кликайте по карте для продолжения');
        };

        document.getElementById('line-undo-btn').addEventListener('click', function() {
            if (draftLineCoords.length > 0) {
                draftLineCoords.pop();
                updateLineDrawerHeader();
                renderEditableVertices();
            }
        });

        document.getElementById('line-clear-btn').addEventListener('click', function() {
            draftLineCoords = [];
            updateLineDrawerHeader();
            renderEditableVertices();
        });

        document.getElementById('line-cancel-btn').addEventListener('click', function() {
            var wasEditing = editingLineId;
            cancelLineMode();
            if (wasEditing) loadData();
        });

        document.getElementById('line-save-btn').addEventListener('click', async function() {
            if (draftLineCoords.length < 2) {
                showToast('Добавьте минимум 2 точки для маршрута!', true);
                return;
            }
            var lineName = document.getElementById('line-name').value.trim() || 'Маршрут';
            var saveBtn = document.getElementById('line-save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Сохранение...';

            var payload = {
                name: lineName,
                description: '',
                lat: draftLineCoords[0][0],
                lng: draftLineCoords[0][1],
                layer: 'Маршруты (Линии)',
                geometry_type: 'LineString',
                coordinates: draftLineCoords
            };

            var res = editingLineId
                ? await db.from('locations').update(payload).eq('id', editingLineId)
                : await db.from('locations').insert([payload]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'Сохранить маршрут';

            if (res.error) {
                showToast('Ошибка: ' + res.error.message, true);
            } else {
                showToast(editingLineId ? 'Маршрут обновлён!' : 'Маршрут сохранён!');
                cancelLineMode();
                loadData();
            }
        });

        /* --- УДАЛЕНИЕ ТОЧКИ ИЛИ ЛИНИИ --- */
        window.deletePoint = async function(id) {
            if (!isAdmin) return;
            if (confirm('Точно удалить этот объект?')) {
                const { error } = await db.from('locations').delete().eq('id', id);
                if (error) {
                    showToast('Ошибка при удалении: ' + error.message, true);
                } else {
                    map.closePopup();
                    closeBottomSheet();
                    showToast('Удалено!');
                    loadData();
                }
            }
        };

        checkInitialAuth();
    </script>
</body>
</html>
