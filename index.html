<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Travel | Карта маршрутов</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; font-family: Arial, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #1a1a1a; filter: brightness(1.3) contrast(1.2) saturate(1.1); }

        /* --- БАЗОВЫЕ СТИЛИ ПОПАПА (для ПК) --- */
        .leaflet-popup-content-wrapper { background-color: #2a2a2a; color: #e0e0e0; border-radius: 12px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); padding: 0; }
        .leaflet-popup-tip { background-color: #2a2a2a; }
        .leaflet-popup-content { max-width: 300px; margin: 0; padding: 0; }
        
        .popup-content { padding: 15px; max-height: 350px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
        .popup-content b { color: #00d4ff; font-size: 16px; display: block; margin-bottom: 5px; }
        
        .popup-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 10px; }
        .popup-gallery a { display: block; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 6px; cursor: pointer; }
        .popup-gallery img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ (Только для телефонов) --- */
        @media (max-width: 768px) {
            /* Жестко фиксируем попап, чтобы он не закрывал карту */
            .leaflet-popup-content {
                width: 80vw !important; 
                max-width: 300px !important;
                margin: 0 !important;
            }
            .popup-content {
                max-height: 35vh; /* Ограничиваем высоту, чтобы оставалось место для карты */
                padding: 12px;
            }
            .leaflet-popup-content-wrapper {
                border-radius: 10px;
            }
            /* Сдвигаем попап вверх, чтобы он не перекрывал кнопки и точку */
            .leaflet-popup {
                bottom: 20px !important; 
            }
        }

        /* --- ОСТАЛЬНОЕ (Кнопки, меню) --- */
        #menu-btn { position: fixed; top: 15px; left: 15px; z-index: 3000; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 8px; padding: 8px 12px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background-color: #2a2a2a; color: white; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.8); z-index: 2000; padding: 60px 20px 20px 20px; box-sizing: border-box; transition: left 0.3s ease-in-out; }
        #sidebar.open { left: 0; }
        #sidebar h2 { font-size: 18px; margin-top: 0; margin-bottom: 5px; color: #00d4ff; }
        #location-count { font-size: 13px; color: #a0a0a0; margin-bottom: 10px; }
        #search-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .location-item { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
        .location-item strong { display: block; font-size: 14px; color: #e0e0e0; }

        #add-point-btn { position: fixed; bottom: 30px; right: 30px; z-index: 2001; background-color: #00d4ff; color: #1a1a1a; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        #locate-btn { position: fixed; bottom: 90px; right: 30px; z-index: 2001; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        
        #add-form { position: fixed; bottom: 90px; right: 30px; z-index: 2002; background-color: #2a2a2a; padding: 15px; border-radius: 12px; border: 1px solid #00d4ff; display: none; flex-direction: column; width: 240px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        #add-form.open { display: flex; }
        #add-form input, #add-form select, #add-form textarea { margin-bottom: 10px; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; }
        #add-form button { background-color: #00d4ff; color: #1a1a1a; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .leaflet-control-layers { background-color: #2a2a2a !important; color: white !important; border-radius: 8px; border: 1px solid #444 !important; }
        .leaflet-control-layers label { color: #e0e0e0; }
    </style>
</head>
<body>
    <button id="menu-btn">☰</button>
    <div id="sidebar">
        <h2>Маршруты и точки</h2>
        <input type="text" id="search-input" placeholder="Поиск по названию...">
        <div id="location-count">Загрузка...</div>
        <div id="location-list"></div>
    </div>
    
    <div id="map"></div>
    
    <button id="locate-btn" title="Моё местоположение">🎯</button>
    <button id="add-point-btn" title="Добавить точку">+</button>

    <div id="add-form">
        <b style="color:#00d4ff; margin-bottom:10px;">Добавить точку</b>
        <input type="text" id="form-name" placeholder="Название" required>
        <textarea id="form-desc" placeholder="Описание" rows="2"></textarea>
        <select id="form-layer">
            <option value="Самара">Самара</option>
            <option value="Питер">Питер</option>
            <option value="Другое">Другое</option>
        </select>
        <button id="form-save">Кликни по карте и сохрани</button>
        <button id="form-cancel" style="background-color:#444; color:white; margin-top:5px;">Отмена</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        
        // Инициализация галереи (настройки для мобильных)
        window.pswpLightbox = new PhotoSwipeLightbox({
            gallery: '.popup-gallery',
            children: 'a',
            pswpModule: () => import('https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js'),
            showHideAnimationType: 'fade',
            closeOnVerticalDrag: true,
            closeTitle: 'Закрыть',
            zoomTitle: 'Увеличить',
            arrowPrevTitle: 'Назад',
            arrowNextTitle: 'Вперед'
        });
        window.pswpLightbox.init();
    </script>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([53.195873, 50.100193], 10);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png?api_key=9fc223d0-2456-4c9d-923d-08dc9822ebc1', { attribution: '&copy; Stadia Maps', maxZoom: 20, keepBuffer: 4 }).addTo(map);

        const SUPABASE_URL = 'https://rawcofbihkxhzxnuhksr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_-IcL5KI7zFxj4IOQom6nDQ_q9UVr77T';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<img src="logo.png" style="width: 40px; height: auto; filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.9));" />`,
            iconSize: [40, 40],
            iconAnchor: [20, 20], 
            popupAnchor: [0, -20]
        });

        var layers = { "Самара": L.layerGroup().addTo(map), "Питер": L.layerGroup(), "Другое": L.layerGroup(), "Маршруты (Линии)": L.layerGroup().addTo(map) };
        var allPoints = [];

        async function loadData() {
            try {
                const { data, error } = await db.from('locations').select('*');
                if (error) throw error;

                Object.values(layers).forEach(layer => layer.clearLayers());
                document.getElementById('location-list').innerHTML = '';
                allPoints = [];
                var count = 0;

                data.forEach(loc => {
                    if (loc.geometry_type === 'LineString') {
                        try {
                            if (Array.isArray(loc.coordinates) && loc.coordinates.length > 0) {
                                L.polyline(loc.coordinates, { color: '#ffffff', weight: 4, opacity: 0.85, lineJoin: 'round' }).addTo(layers["Маршруты (Линии)"]);
                                count++;
                            }
                        } catch(e) {}
                        return;
                    }

                    var imageHtml = '';
                    if (loc.image_url && loc.image_url.trim() !== '') {
                        var urls = loc.image_url.split(',').map(s => s.trim()).filter(s => s);
                        if (urls.length > 0) {
                            imageHtml = `<div class="popup-gallery">`;
                            urls.forEach(url => {
                                imageHtml += `<a href="${url}" data-pswp-width="800" data-pswp-height="600">
                                                <img src="${url}" alt="Фото" onerror="this.style.display='none'">
                                              </a>`;
                            });
                            imageHtml += `</div>`;
                        }
                    }

                    // Оборачиваем в контейнер с прокруткой
                    var marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).bindPopup(`
                        <div class="popup-content">
                            <b>${loc.name}</b><br><br>${loc.description || ''}${imageHtml}
                        </div>
                    `);

                    if (layers[loc.layer]) layers[loc.layer].addLayer(marker);
                    else layers["Другое"].addLayer(marker);

                    allPoints.push({ name: loc.name, lat: loc.lat, lng: loc.lng, marker: marker });
                    count++;
                });

                document.getElementById('location-count').innerText = `Объектов на карте: ${count}`;
                allPoints.sort((a, b) => a.name.localeCompare(b.name));
                renderList(allPoints);

            } catch (err) {
                document.getElementById('location-list').innerHTML = "<p style='color:red;'>Ошибка данных</p>";
            }
        }

        function renderList(points) {
            var listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';
            points.forEach(loc => {
                var div = document.createElement('div');
                div.className = 'location-item';
                div.innerHTML = `<strong>${loc.name}</strong>`;
                div.onclick = function() {
                    map.flyTo([loc.lat, loc.lng], 14, { duration: 1.5 });
                    loc.marker.openPopup();
                    if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
                };
                listContainer.appendChild(div);
            });
        }

        L.control.layers(null, layers, { collapsed: false, position: 'topright' }).addTo(map);
        loadData();

        document.getElementById('menu-btn').addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
        document.getElementById('search-input').addEventListener('input', function(e) {
            var text = e.target.value.toLowerCase();
            renderList(allPoints.filter(p => p.name.toLowerCase().includes(text)));
        });
        document.getElementById('locate-btn').addEventListener('click', function() { map.locate({setView: true, maxZoom: 14}); });
        map.on('locationfound', function(e) { L.marker(e.latlng, { icon: customIcon }).addTo(map).bindPopup('Вы здесь!').openPopup(); });

        var newLat = 0, newLng = 0;
        document.getElementById('add-point-btn').addEventListener('click', function() {
            document.getElementById('add-form').classList.toggle('open');
            if (document.getElementById('add-form').classList.contains('open')) {
                alert('Кликни по карте, чтобы выбрать место');
                map.once('click', function(e) { newLat = e.latlng.lat; newLng = e.latlng.lng; alert(`Координаты: ${newLat.toFixed(4)}, ${newLng.toFixed(4)}`); });
            }
        });
        document.getElementById('form-cancel').addEventListener('click', function() { document.getElementById('add-form').classList.remove('open'); });
        document.getElementById('form-save').addEventListener('click', async function() {
            var name = document.getElementById('form-name').value;
            var desc = document.getElementById('form-desc').value;
            var layer = document.getElementById('form-layer').value;
            if (!name || newLat === 0) { alert('Введи название и кликни по карте!'); return; }
            const { error } = await db.from('locations').insert([{ name, description: desc, lat: newLat, lng: newLng, layer, geometry_type: 'Point', coordinates: '[]' }]);
            if (error) alert('Ошибка: ' + error.message);
            else {
                alert('Точка добавлена!');
                document.getElementById('add-form').classList.remove('open');
                document.getElementById('form-name').value = '';
                loadData();
            }
        });
    </script>
</body>
</html>
