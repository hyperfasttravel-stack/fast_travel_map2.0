<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Travel | Карта маршрутов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #1a1a1a; filter: brightness(1.3) contrast(1.2) saturate(1.1); }
        
        /* Кластеры */
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(0, 212, 255, 0.6) !important; border: 2px solid #fff !important; }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: #1a1a1a !important; color: #00d4ff !important; font-weight: bold; }
        
        /* Десктопный попап */
        .leaflet-popup-content-wrapper { background-color: #2a2a2a; color: #e0e0e0; border-radius: 12px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); padding: 0; }
        .leaflet-popup-tip { background-color: #2a2a2a; }
        .leaflet-popup-content { max-width: 320px; min-width: 260px; margin: 0; padding: 0; }
        
        /* Карточка объекта */
        .card-content { padding: 15px; font-size: 14px; line-height: 1.5; color: #e0e0e0; }
        .card-content b { color: #00d4ff; font-size: 17px; display: block; margin-bottom: 4px; padding-right: 25px; }
        .card-layer-badge { display: inline-block; font-size: 11px; color: #00d4ff; background: rgba(0, 212, 255, 0.12); border: 1px solid rgba(0, 212, 255, 0.3); padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }
        .card-desc { margin-bottom: 10px; white-space: pre-line; color: #d5d5d5; }
        
        /* Галерея фото */
        .popup-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
        .popup-gallery.single-photo { grid-template-columns: 1fr; }
        .popup-gallery a { display: block; width: 100%; aspect-ratio: 16/10; overflow: hidden; border-radius: 8px; cursor: zoom-in; background: #1a1a1a; position: relative; border: 1px solid #3a3a3a; }
        .popup-gallery.single-photo a { aspect-ratio: 16/11; }
        .popup-gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; display: block; }
        .popup-gallery a:hover img { transform: scale(1.03); }
        .zoom-hint { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,0.65); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; pointer-events: none; }

        /* Кнопки действий в карточке */
        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .action-btn { flex: 1; padding: 9px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: none; transition: 0.2s; }
        .route-btn { background-color: #ffcc00; color: #1a1a1a; }
        .route-btn:hover { background-color: #e6b800; }
        .share-btn { background-color: #333; color: #00d4ff; border: 1px solid #00d4ff; }
        .share-btn:hover { background-color: rgba(0, 212, 255, 0.15); }
        
        .admin-actions { display: flex; gap: 8px; margin-top: 8px; }
        .edit-btn { flex: 1; background-color: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid #00d4ff; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .edit-btn:hover { background-color: #00d4ff; color: #1a1a1a; }
        .delete-btn { flex: 1; background-color: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .delete-btn:hover { background-color: #ff4d4d; color: white; }

        /* Мобильная выдвижная шторка */
        #bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; height: 85vh;
            background-color: #242424; border-top: 1px solid #444;
            border-radius: 20px 20px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.85);
            z-index: 2500; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column;
        }
        #bottom-sheet.half { transform: translateY(42vh); }
        #bottom-sheet.full { transform: translateY(0); }
        #sheet-drag-zone { padding: 12px 0 8px 0; touch-action: none; display: flex; justify-content: center; align-items: center; position: relative; flex-shrink: 0; cursor: grab; }
        #sheet-handle { width: 42px; height: 5px; background-color: #666; border-radius: 3px; }
        #sheet-close-btn { position: absolute; right: 15px; top: 8px; background: #333; border: none; color: #aaa; width: 28px; height: 28px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        #sheet-body { overflow-y: auto; padding: 0 18px 45px 18px; flex-grow: 1; overscroll-behavior: contain; }
        @media (min-width: 769px) { #bottom-sheet { display: none !important; } }

        /* Меню и боковая панель */
        #menu-btn { position: fixed; top: 15px; left: 15px; z-index: 3000; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 8px; padding: 8px 12px; font-size: 20px; cursor: pointer; }
        #sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background-color: #2a2a2a; color: white; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.8); z-index: 2900; padding: 65px 20px 25px 20px; box-sizing: border-box; transition: left 0.3s ease-in-out; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        #sidebar h2 { font-size: 18px; margin-top: 0; margin-bottom: 5px; color: #00d4ff; }
        #location-count { font-size: 13px; color: #a0a0a0; margin-bottom: 10px; }
        #search-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; margin-bottom: 12px; box-sizing: border-box; }
        #location-list { flex-grow: 1; overflow-y: auto; }
        .location-item { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
        .location-item:hover { background-color: #333; }
        .location-item strong { display: block; font-size: 14px; color: #e0e0e0; }
        .location-item span { font-size: 11px; color: #00d4ff; }

        /* Блок роли внизу сайдбара */
        #role-box { margin-top: 15px; padding-top: 12px; border-top: 1px solid #444; }
        #role-badge { font-size: 12px; color: #00d4ff; border: 1px solid #00d4ff; padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; text-align: center; }
        #switch-role-btn { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #00d4ff; background: transparent; color: #00d4ff; cursor: pointer; font-weight: bold; font-size: 13px; }
        #switch-role-btn:hover { background: rgba(0, 212, 255, 0.15); }

        /* Плавающие кнопки справа */
        #add-point-btn { position: fixed; bottom: 30px; right: 20px; z-index: 2001; background-color: #00d4ff; color: #1a1a1a; border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
        #draw-line-btn { position: fixed; bottom: 100px; right: 20px; z-index: 2001; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 50%; width: 56px; height: 56px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
        #locate-btn { position: fixed; bottom: 30px; right: 20px; z-index: 2001; background-color: #2a2a2a; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 50%; width: 56px; height: 56px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        body.is-admin #locate-btn { bottom: 170px; }
        body.is-admin #add-point-btn { display: flex; }
        body.is-admin #draw-line-btn { display: flex; }

        /* Форма добавления / редактирования точки */
        #add-form, #line-form { position: fixed; bottom: 95px; right: 20px; z-index: 2600; background-color: #2a2a2a; padding: 15px; border-radius: 12px; border: 1px solid #00d4ff; display: none; flex-direction: column; width: 270px; box-shadow: 0 4px 15px rgba(0,0,0,0.85); max-height: 75vh; overflow-y: auto; }
        #add-form.open, #line-form.open { display: flex; }
        @media (max-width: 768px) { #add-form, #line-form { right: 10px; left: 10px; width: auto; bottom: 90px; } }
        #add-form input, #add-form select, #add-form textarea, #line-form input, #line-form select { margin-bottom: 10px; padding: 8px; border-radius: 6px; border: 1px solid #444; background-color: #1a1a1a; color: white; font-family: inherit; font-size: 13px; }
        .file-label { background-color: #1a1a1a; border: 1px dashed #00d4ff; color: #00d4ff; padding: 8px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; margin-bottom: 8px; display: block; }
        #file-count { font-size: 11px; color: #aaa; margin-top: -4px; margin-bottom: 10px; text-align: center; }
        .primary-btn { background-color: #00d4ff; color: #1a1a1a; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .secondary-btn { background-color: #444; color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; margin-top: 6px; font-size: 13px; }

        /* Модальное окно выбора роли / входа */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 15px; }
        #auth-modal.hidden { display: none; }
        .auth-box { background: #242424; border: 1px solid #00d4ff; border-radius: 14px; padding: 22px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; color: #fff; }
        .auth-box h3 { margin: 0 0 8px 0; color: #00d4ff; font-size: 19px; }
        .auth-box p { margin: 0 0 16px 0; font-size: 13px; color: #bbb; }
        .auth-box input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; font-size: 14px; }
        .auth-btn-user { width: 100%; padding: 11px; border-radius: 8px; border: none; background: #00d4ff; color: #1a1a1a; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
        .auth-btn-admin { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #00d4ff; background: transparent; color: #00d4ff; font-weight: bold; font-size: 14px; cursor: pointer; }
        #admin-login-fields { display: none; margin-top: 12px; border-top: 1px solid #3a3a3a; padding-top: 12px; }
        #admin-login-fields.open { display: block; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #2a2a2a; color: #00d4ff; padding: 10px 20px; border-radius: 8px; border: 1px solid #00d4ff; z-index: 6000; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; text-align: center; font-size: 14px; max-width: 85%; }
        .leaflet-control-layers { background-color: #2a2a2a !important; color: white !important; border-radius: 8px; border: 1px solid #444 !important; }
        .leaflet-control-layers label { color: #e0e0e0; }
        .pswp { z-index: 7000 !important; }
    </style>
</head>
<body>

    <!-- Окно выбора режима входа -->
    <div id="auth-modal">
        <div class="auth-box">
            <h3>Fast Travel Map</h3>
            <p>Выберите режим работы с картой</p>
            <button id="enter-user-btn" class="auth-btn-user">Обычный пользователь (Просмотр)</button>
            <button id="show-admin-login-btn" class="auth-btn-admin">Войти как Админ</button>
            <div id="admin-login-fields">
                <input type="email" id="admin-email" placeholder="Email администратора">
                <input type="password" id="admin-password" placeholder="Пароль">
                <button id="admin-submit-btn" class="auth-btn-user">Войти в панель Админа</button>
            </div>
        </div>
    </div>

    <button id="menu-btn">☰</button>
    <div id="sidebar">
        <h2>Маршруты и точки</h2>
        <input type="text" id="search-input" placeholder="Поиск по названию...">
        <div id="location-count">Загрузка...</div>
        <div id="location-list"></div>
        <div id="role-box">
            <div id="role-badge">Роль: Гость</div>
            <button id="switch-role-btn">Сменить роль / Войти</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Выдвижная мобильная шторка -->
    <div id="bottom-sheet">
        <div id="sheet-drag-zone">
            <div id="sheet-handle"></div>
            <button id="sheet-close-btn">×</button>
        </div>
        <div id="sheet-body"></div>
    </div>

    <button id="locate-btn" title="Моё местоположение">🎯</button>
    <button id="draw-line-btn" title="Нарисовать маршрут">〰️</button>
    <button id="add-point-btn" title="Добавить точку">+</button>

    <!-- Форма добавления / редактирования точки -->
    <div id="add-form">
        <b id="form-title" style="color:#00d4ff; margin-bottom:6px;">Добавить точку</b>
        <p id="coords-hint" style="font-size:12px; color:#aaa; margin:0 0 10px 0;">Кликни по карте, чтобы поставить пин</p>
        <input type="hidden" id="edit-point-id" value="">
        <input type="text" id="form-name" placeholder="Название" required>
        <textarea id="form-desc" placeholder="Описание" rows="2"></textarea>
        <label class="file-label" for="form-files">📷 Выбрать фото с устройства</label>
        <input type="file" id="form-files" accept="image/*" multiple style="display:none;">
        <div id="file-count">Файлы не выбраны</div>
        <input type="text" id="form-images" placeholder="Ссылки на фото (через запятую)">
        <select id="form-layer">
            <option value="Самара">Самара</option>
            <option value="Питер">Питер</option>
            <option value="Другое">Другое</option>
        </select>
        <button id="form-save" class="primary-btn">Сохранить точку</button>
        <button id="form-cancel" class="secondary-btn">Отмена</button>
    </div>

    <!-- Форма рисования линии маршрута -->
    <div id="line-form">
        <b style="color:#00d4ff; margin-bottom:6px;">Новый маршрут (линия)</b>
        <p id="line-hint" style="font-size:12px; color:#aaa; margin:0 0 10px 0;">Кликай по карте, чтобы ставить точки линии (точек: 0)</p>
        <input type="text" id="line-name" placeholder="Название маршрута">
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <button id="line-undo-btn" class="secondary-btn" style="flex:1; margin-top:0;">↩ Шаг назад</button>
            <button id="line-clear-btn" class="secondary-btn" style="flex:1; margin-top:0;">Очистить</button>
        </div>
        <button id="line-save-btn" class="primary-btn">Сохранить маршрут</button>
        <button id="line-cancel-btn" class="secondary-btn">Отмена</button>
    </div>

    <div id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        window.PhotoSwipeLightbox = PhotoSwipeLightbox;
        window.pswpModule = () => import('https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js');
    </script>

    <script>
        var map = L.map('map', { zoomControl: false }).setView(L.latLng(53.195873, 50.100193), 10);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png?api_key=9fc223d0-2456-4c9d-923d-08dc9822ebc1', {
            attribution: '&copy; Stadia Maps',
            maxZoom: 20,
            keepBuffer: 4
        }).addTo(map);

        const SUPABASE_URL = 'https://rawcofbihkxhzxnuhksr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-IcL5KI7zFxj4IOQom6nDQ_q9UVr77T';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* Белое свечение вокруг логотипа */
        var customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<img src="logo.png" style="width: 56px; height: auto; filter: drop-shadow(0px 0px 10px rgba(255, 255, 255, 0.95));" />`,
            iconSize: L.point(56, 56),
            iconAnchor: L.point(28, 28),
            popupAnchor: L.point(0, -28)
        });

        var clusterGroups = {
            "Самара": L.markerClusterGroup({ maxClusterRadius: 50 }).addTo(map),
            "Питер": L.markerClusterGroup({ maxClusterRadius: 50 }),
            "Другое": L.markerClusterGroup({ maxClusterRadius: 50 })
        };
        var lineLayer = L.layerGroup().addTo(map);
        var layers = {
            "Самара": clusterGroups["Самара"],
            "Питер": clusterGroups["Питер"],
            "Другое": clusterGroups["Другое"],
            "Маршруты (Линии)": lineLayer
        };

        var allPoints = [];
        var rawLocationsMap = {};
        var markerStore = {};
        var userLocationMarker = null;
        var userAccuracyCircle = null;
        var tempDraftMarker = null;
        var isAdmin = false;
        var initialUrlPointHandled = false;

        function isMobile() {
            return window.innerWidth <= 768;
        }

        function showToast(message, isError = false) {
            var toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.color = isError ? '#ff4d4d' : '#00d4ff';
            toast.style.borderColor = isError ? '#ff4d4d' : '#00d4ff';
            toast.style.display = 'block';
            clearTimeout(toast.timer);
            toast.timer = setTimeout(function() {
                toast.style.display = 'none';
            }, 3500);
        }

        /* --- АВТОРИЗАЦИЯ И РОЛИ --- */
        function applyRoleUI(adminStatus, emailText) {
            isAdmin = adminStatus;
            if (isAdmin) {
                document.body.classList.add('is-admin');
                document.getElementById('role-badge').innerText = `Роль: Админ (${emailText || 'вход выполнен'})`;
                document.getElementById('switch-role-btn').innerText = 'Выйти из Админа';
            } else {
                document.body.classList.remove('is-admin');
                document.getElementById('role-badge').innerText = 'Роль: Обычный пользователь';
                document.getElementById('switch-role-btn').innerText = 'Войти как Админ';
                closeAddForm();
                closeLineForm();
            }
        }

        async function initAuth() {
            const { data } = await db.auth.getSession();
            if (data && data.session && data.session.user) {
                applyRoleUI(true, data.session.user.email);
                document.getElementById('auth-modal').classList.add('hidden');
                loadData();
            } else {
                const savedGuest = sessionStorage.getItem('ft_guest_mode');
                if (savedGuest === '1') {
                    applyRoleUI(false);
                    document.getElementById('auth-modal').classList.add('hidden');
                    loadData();
                } else {
                    document.getElementById('auth-modal').classList.remove('hidden');
                }
            }
        }

        document.getElementById('enter-user-btn').addEventListener('click', function() {
            sessionStorage.setItem('ft_guest_mode', '1');
            applyRoleUI(false);
            document.getElementById('auth-modal').classList.add('hidden');
            loadData();
        });

        document.getElementById('show-admin-login-btn').addEventListener('click', function() {
            document.getElementById('admin-login-fields').classList.toggle('open');
        });

        document.getElementById('admin-submit-btn').addEventListener('click', async function() {
            var email = document.getElementById('admin-email').value.trim();
            var password = document.getElementById('admin-password').value;
            if (!email || !password) {
                showToast('Введите Email и пароль админа', true);
                return;
            }
            const { data, error } = await db.auth.signInWithPassword({ email: email, password: password });
            if (error) {
                showToast('Ошибка входа: ' + error.message, true);
            } else {
                sessionStorage.removeItem('ft_guest_mode');
                applyRoleUI(true, data.user.email);
                document.getElementById('auth-modal').classList.add('hidden');
                showToast('Вы вошли как Администратор');
                loadData();
            }
        });

        document.getElementById('switch-role-btn').addEventListener('click', async function() {
            if (isAdmin) {
                await db.auth.signOut();
                applyRoleUI(false);
                showToast('Вы вышли из режима Админа');
                loadData();
            } else {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('admin-login-fields').classList.add('open');
            }
        });

        /* --- ЛУПА / ПОЛНОЭКРАННЫЙ ПРОСМОТР ФОТО (PHOTOSWIPE) --- */
        document.addEventListener('click', function(e) {
            const link = e.target.closest('.popup-gallery a');
            if (!link) return;
            e.preventDefault();
            e.stopPropagation();

            const gallery = link.closest('.popup-gallery');
            const links = Array.from(gallery.querySelectorAll('a'));
            const dataSource = links.map(function(a) {
                const img = a.querySelector('img');
                return {
                    src: a.getAttribute('href'),
                    w: parseInt(a.getAttribute('data-pswp-width'), 10) || (img && img.naturalWidth) || 1200,
                    h: parseInt(a.getAttribute('data-pswp-height'), 10) || (img && img.naturalHeight) || 900
                };
            });

            if (window.PhotoSwipeLightbox && window.pswpModule) {
                const lightbox = new window.PhotoSwipeLightbox({
                    dataSource: dataSource,
                    pswpModule: window.pswpModule,
                    showHideAnimationType: 'fade',
                    closeOnVerticalDrag: true
                });
                lightbox.init();
                lightbox.loadAndOpen(links.indexOf(link));
            }
        });

        function updatePhotoSizes() {
            document.querySelectorAll('.popup-gallery a').forEach(function(link) {
                const img = new Image();
                img.onload = function() {
                    link.setAttribute('data-pswp-width', this.naturalWidth);
                    link.setAttribute('data-pswp-height', this.naturalHeight);
                };
                img.src = link.getAttribute('href');
            });
        }

        /* --- ВЫДВИЖНАЯ ШТОРКА (BOTTOM SHEET) --- */
        const sheet = document.getElementById('bottom-sheet');
        const sheetBody = document.getElementById('sheet-body');
        const dragZone = document.getElementById('sheet-drag-zone');
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        function openBottomSheet(htmlContent) {
            sheetBody.innerHTML = htmlContent;
            sheetBody.scrollTop = 0;
            sheet.classList.remove('full');
            sheet.classList.add('half');
            updatePhotoSizes();
        }

        function closeBottomSheet() {
            sheet.classList.remove('half', 'full');
        }

        document.getElementById('sheet-close-btn').addEventListener('click', closeBottomSheet);

        map.on('click', function() {
            const addOpen = document.getElementById('add-form').classList.contains('open');
            const lineOpen = document.getElementById('line-form').classList.contains('open');
            if (!addOpen && !lineOpen) {
                closeBottomSheet();
            }
        });

        dragZone.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length > 0) {
                startY = e.touches.item(0).clientY;
                isDragging = true;
                sheet.style.transition = 'none';
            }
        }, { passive: true });

        dragZone.addEventListener('touchmove', function(e) {
            if (!isDragging || !e.touches || e.touches.length === 0) return;
            currentY = e.touches.item(0).clientY;
            const deltaY = currentY - startY;
            const baseOffset = sheet.classList.contains('full') ? 0 : window.innerHeight * 0.42;
            sheet.style.transform = `translateY(${Math.max(0, baseOffset + deltaY)}px)`;
        }, { passive: true });

        dragZone.addEventListener('touchend', function() {
            if (!isDragging) return;
            isDragging = false;
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            sheet.style.transform = '';
            const deltaY = currentY - startY;
            if (Math.abs(deltaY) < 20) return;
            if (deltaY < -50) {
                sheet.classList.remove('half');
                sheet.classList.add('full');
            } else if (deltaY > 50) {
                if (sheet.classList.contains('full')) {
                    sheet.classList.remove('full');
                    sheet.classList.add('half');
                } else {
                    closeBottomSheet();
                }
            }
            startY = 0;
            currentY = 0;
        });

        /* Разбор ссылок на фото (поддерживает и обычные URL, и data:image base64) */
        function parseImageUrls(rawStr) {
            if (!rawStr || rawStr.trim() === '') return [];
            var parts = rawStr.split(',');
            var result = [];
            for (var i = 0; i < parts.length; i++) {
                var item = parts[i].trim();
                if (!item) continue;
                if (item.startsWith('data:image') && i + 1 < parts.length) {
                    result.push(item + ',' + parts[i + 1].trim());
                    i++;
                } else {
                    result.push(item);
                }
            }
            return result;
        }

        /* --- ПОДЕЛИТЬСЯ ТОЧКОЙ (ПРЯМАЯ ССЫЛКА) --- */
        window.sharePoint = function(id) {
            var url = new URL(window.location.href);
            url.searchParams.set('point', id);
            var shareUrl = url.toString();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(function() {
                    showToast('Ссылка на точку скопирована!');
                }).catch(function() {
                    prompt('Скопируйте ссылку на точку:', shareUrl);
                });
            } else {
                prompt('Скопируйте ссылку на точку:', shareUrl);
            }
        };

        /* --- ЗАГРУЗКА ДАННЫХ --- */
        async function loadData() {
            try {
                const { data, error } = await db.from('locations').select('*');
                if (error) throw error;

                Object.values(clusterGroups).forEach(function(g) { g.clearLayers(); });
                lineLayer.clearLayers();
                document.getElementById('location-list').innerHTML = '';
                allPoints = [];
                rawLocationsMap = {};
                markerStore = {};
                var count = 0;

                data.forEach(function(loc) {
                    rawLocationsMap[loc.id] = loc;

                    if (loc.geometry_type === 'LineString') {
                        try {
                            var coords = typeof loc.coordinates === 'string' ? JSON.parse(loc.coordinates) : loc.coordinates;
                            if (Array.isArray(coords) && coords.length > 0) {
                                var poly = L.polyline(coords, { color: '#ffffff', weight: 2.5, opacity: 0.85, lineJoin: 'round' }).addTo(lineLayer);
                                if (isAdmin) {
                                    poly.bindPopup(`<div class="card-content"><b>${loc.name || 'Маршрут'}</b><button class="delete-btn" onclick="deletePoint(${loc.id})">Удалить маршрут</button></div>`);
                                } else if (loc.name) {
                                    poly.bindPopup(`<div class="card-content"><b>${loc.name}</b></div>`);
                                }
                                count++;
                            }
                        } catch(e) {}
                        return;
                    }

                    var urls = parseImageUrls(loc.image_url);
                    var imageHtml = '';
                    if (urls.length > 0) {
                        var gridClass = urls.length === 1 ? 'popup-gallery single-photo' : 'popup-gallery';
                        imageHtml = `<div class="${gridClass}">`;
                        urls.forEach(function(url) {
                            imageHtml += `<a href="${url}" data-pswp-width="1200" data-pswp-height="900"><img src="${url}" alt="Фото" loading="lazy"><span class="zoom-hint">🔍</span></a>`;
                        });
                        imageHtml += '</div>';
                    }

                    var yandexUrl = `https://yandex.ru/maps/?rtext=~${loc.lat},${loc.lng}`;
                    var publicActionsHtml = `
                        <div class="card-actions">
                            <a href="${yandexUrl}" target="_blank" rel="noopener" class="action-btn route-btn">🧭 Маршрут</a>
                            <button class="action-btn share-btn" onclick="sharePoint(${loc.id})">🔗 Поделиться</button>
                        </div>
                    `;

                    var adminActionsHtml = isAdmin ? `
                        <div class="admin-actions">
                            <button class="edit-btn" onclick="openEditPoint(${loc.id})">✏️ Изменить</button>
                            <button class="delete-btn" onclick="deletePoint(${loc.id})">🗑 Удалить</button>
                        </div>
                    ` : '';

                    var cardHtml = `
                        <div class="card-content">
                            <b>${loc.name}</b>
                            <span class="card-layer-badge">${loc.layer || 'Точка'}</span>
                            <div class="card-desc">${loc.description || 'Без описания'}</div>
                            ${imageHtml}
                            ${publicActionsHtml}
                            ${adminActionsHtml}
                        </div>
                    `;

                    var marker = L.marker(L.latLng(loc.lat, loc.lng), { icon: customIcon });

                    marker.on('click', function(e) {
                        if (e && e.originalEvent) L.DomEvent.stopPropagation(e);
                        if (isMobile()) {
                            openBottomSheet(cardHtml);
                            const targetPoint = map.project(L.latLng(loc.lat, loc.lng), map.getZoom());
                            targetPoint.y += window.innerHeight * 0.18;
                            map.panTo(map.unproject(targetPoint, map.getZoom()), { animate: true });
                        } else {
                            marker.bindPopup(cardHtml).openPopup();
                            setTimeout(updatePhotoSizes, 50);
                        }
                    });

                    markerStore[loc.id] = marker;
                    var layerName = loc.layer ? loc.layer.trim().toLowerCase() : '';
                    var targetGroupKey = "Другое";
                    if (layerName.includes('питер') || layerName.includes('piter')) targetGroupKey = "Питер";
                    else if (layerName.includes('самара') || layerName.includes('samara')) targetGroupKey = "Самара";

                    clusterGroups[targetGroupKey].addLayer(marker);
                    allPoints.push({
                        id: loc.id,
                        name: loc.name,
                        layer: targetGroupKey,
                        lat: loc.lat,
                        lng: loc.lng,
                        marker: marker,
                        group: clusterGroups[targetGroupKey]
                    });
                    count++;
                });

                document.getElementById('location-count').innerText = `Объектов на карте: ${count}`;
                allPoints.sort(function(a, b) { return a.name.localeCompare(b.name); });
                renderList(allPoints);

                /* Переход к точке по прямой ссылке (?point=ID) */
                if (!initialUrlPointHandled) {
                    initialUrlPointHandled = true;
                    var urlParams = new URLSearchParams(window.location.search);
                    var targetPointId = urlParams.get('point');
                    if (targetPointId) {
                        var found = allPoints.find(function(p) { return String(p.id) === String(targetPointId); });
                        if (found) {
                            if (!map.hasLayer(found.group)) map.addLayer(found.group);
                            found.group.zoomToShowLayer(found.marker, function() {
                                found.marker.fire('click');
                            });
                        }
                    }
                }
            } catch (err) {
                document.getElementById('location-list').innerHTML = "<p style='color:red;'>Ошибка загрузки данных</p>";
            }
        }

        function renderList(points) {
            var listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';
            points.forEach(function(loc) {
                var div = document.createElement('div');
                div.className = 'location-item';
                div.innerHTML = `<strong>${loc.name}</strong><span>${loc.layer}</span>`;
                div.onclick = function() {
                    if (!map.hasLayer(loc.group)) map.addLayer(loc.group);
                    loc.group.zoomToShowLayer(loc.marker, function() {
                        loc.marker.fire('click');
                    });
                    if (isMobile()) document.getElementById('sidebar').classList.remove('open');
                };
                listContainer.appendChild(div);
            });
        }

        map.on('overlayadd', function(e) {
            if (e.name === 'Питер') map.flyTo(L.latLng(59.934127, 30.305973), 10, { duration: 1.5 });
        });
        map.on('overlayremove', function(e) {
            if (e.name === 'Питер') map.flyTo(L.latLng(53.195873, 50.100193), 10, { duration: 1.5 });
        });

        L.control.layers(null, layers, { collapsed: true, position: 'topright' }).addTo(map);
        initAuth();

        document.getElementById('menu-btn').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        document.getElementById('search-input').addEventListener('input', function(e) {
            var text = e.target.value.toLowerCase();
            renderList(allPoints.filter(function(p) { return p.name.toLowerCase().includes(text); }));
        });

        /* --- ГЕОЛОКАЦИЯ (GPS) --- */
        document.getElementById('locate-btn').addEventListener('click', function() {
            if (!navigator.geolocation) {
                showToast('Браузер не поддерживает геолокацию', true);
                return;
            }
            showToast('Определяем местоположение...');
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    var accuracy = pos.coords.accuracy;
                    map.flyTo(latlng, 16, { duration: 1.2 });
                    if (userLocationMarker) {
                        userLocationMarker.setLatLng(latlng);
                        userAccuracyCircle.setLatLng(latlng).setRadius(accuracy);
                    } else {
                        userAccuracyCircle = L.circle(latlng, { radius: accuracy, color: '#00d4ff', fillColor: '#00d4ff', fillOpacity: 0.15, weight: 1 }).addTo(map);
                        userLocationMarker = L.circleMarker(latlng, { radius: 9, fillColor: '#00d4ff', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 1 }).addTo(map).bindPopup(`Вы здесь (точность ~${Math.round(accuracy)} м)`);
                    }
                    userLocationMarker.openPopup();
                },
                function(err) {
                    if (err.code === 1) showToast('Доступ к геолокации запрещён в настройках браузера', true);
                    else showToast('Не удалось определить координаты. Включите GPS', true);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        /* --- СЖАТИЕ ФОТО --- */
        document.getElementById('form-files').addEventListener('change', function(e) {
            var count = e.target.files ? e.target.files.length : 0;
            document.getElementById('file-count').innerText = count > 0 ? `Выбрано файлов: ${count}` : 'Файлы не выбраны';
        });

        function compressImage(file) {
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var maxDim = 1280;
                        var w = img.width;
                        var h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                            else { w = Math.round(w * maxDim / h); h = maxDim; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) {
                            resolve({ blob: blob, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        /* --- ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ ТОЧЕК (ДЛЯ АДМИНА) --- */
        var newLat = 0;
        var newLng = 0;

        function setDraftPoint(latlng) {
            newLat = latlng.lat;
            newLng = latlng.lng;
            document.getElementById('coords-hint').innerText = `Координаты: ${newLat.toFixed(5)}, ${newLng.toFixed(5)} (пин можно двигать)`;
            if (!tempDraftMarker) {
                tempDraftMarker = L.marker(latlng, { draggable: true }).addTo(map);
                tempDraftMarker.on('dragend', function(ev) {
                    var pos = ev.target.getLatLng();
                    newLat = pos.lat;
                    newLng = pos.lng;
                    document.getElementById('coords-hint').innerText = `Координаты: ${newLat.toFixed(5)}, ${newLng.toFixed(5)}`;
                });
            } else {
                tempDraftMarker.setLatLng(latlng);
            }
        }

        function onMapClickForPoint(e) {
            setDraftPoint(e.latlng);
        }

        function closeAddForm() {
            document.getElementById('add-form').classList.remove('open');
            map.off('click', onMapClickForPoint);
            if (tempDraftMarker) {
                map.removeLayer(tempDraftMarker);
                tempDraftMarker = null;
            }
            newLat = 0;
            newLng = 0;
            document.getElementById('edit-point-id').value = '';
            document.getElementById('form-title').innerText = 'Добавить точку';
            document.getElementById('form-name').value = '';
            document.getElementById('form-desc').value = '';
            document.getElementById('form-images').value = '';
            document.getElementById('form-files').value = '';
            document.getElementById('file-count').innerText = 'Файлы не выбраны';
            document.getElementById('coords-hint').innerText = 'Кликни по карте, чтобы поставить пин';
        }

        document.getElementById('add-point-btn').addEventListener('click', function() {
            if (!isAdmin) return;
            var form = document.getElementById('add-form');
            if (form.classList.contains('open')) {
                closeAddForm();
            } else {
                closeLineForm();
                closeBottomSheet();
                form.classList.add('open');
                showToast('Кликни по карте, чтобы выбрать место');
                map.on('click', onMapClickForPoint);
            }
        });

        window.openEditPoint = function(id) {
            if (!isAdmin) return;
            var loc = rawLocationsMap[id];
            if (!loc) return;

            map.closePopup();
            closeBottomSheet();
            closeLineForm();

            document.getElementById('edit-point-id').value = loc.id;
            document.getElementById('form-title').innerText = 'Редактировать точку';
            document.getElementById('form-name').value = loc.name || '';
            document.getElementById('form-desc').value = loc.description || '';
            document.getElementById('form-images').value = loc.image_url || '';
            document.getElementById('form-layer').value = loc.layer || 'Самара';

            setDraftPoint(L.latLng(loc.lat, loc.lng));
            document.getElementById('add-form').classList.add('open');
            map.on('click', onMapClickForPoint);
        };

        document.getElementById('form-cancel').addEventListener('click', closeAddForm);

        document.getElementById('form-save').addEventListener('click', async function() {
            if (!isAdmin) return;
            var editId = document.getElementById('edit-point-id').value;
            var name = document.getElementById('form-name').value.trim();
            var desc = document.getElementById('form-desc').value.trim();
            var manualUrls = document.getElementById('form-images').value.trim();
            var layer = document.getElementById('form-layer').value;
            var fileInput = document.getElementById('form-files');
            var saveBtn = document.getElementById('form-save');

            if (!name || newLat === 0) {
                showToast('Введи название и выбери место на карте!', true);
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = 'Сохранение...';
            var finalUrls = parseImageUrls(manualUrls);

            if (fileInput.files && fileInput.files.length > 0) {
                for (var i = 0; i < fileInput.files.length; i++) {
                    var compressed = await compressImage(fileInput.files.item(i));
                    var fileName = `${Date.now()}_${i}.jpg`;
                    const { error: uploadErr } = await db.storage.from('photos').upload(fileName, compressed.blob, { contentType: 'image/jpeg' });
                    if (!uploadErr) {
                        const { data: pubData } = db.storage.from('photos').getPublicUrl(fileName);
                        finalUrls.push(pubData.publicUrl);
                    } else {
                        finalUrls.push(compressed.dataUrl);
                    }
                }
            }

            var payload = {
                name: name,
                description: desc,
                image_url: finalUrls.join(', '),
                lat: newLat,
                lng: newLng,
                layer: layer
            };

            var dbError = null;
            if (editId) {
                const { error } = await db.from('locations').update(payload).eq('id', editId);
                dbError = error;
            } else {
                payload.geometry_type = 'Point';
                payload.coordinates = '[]';
                const { error } = await db.from('locations').insert([payload]);
                dbError = error;
            }

            saveBtn.disabled = false;
            saveBtn.innerText = 'Сохранить точку';

            if (dbError) {
                showToast(`Ошибка: ${dbError.message}`, true);
            } else {
                showToast(editId ? 'Точка обновлена!' : 'Точка добавлена!');
                closeAddForm();
                loadData();
            }
        });

        /* --- РИСОВАНИЕ ЛИНИЙ МАРШРУТОВ (ДЛЯ АДМИНА) --- */
        var draftLineCoords = [];
        var draftPolyline = null;
        var draftLineMarkers = [];

        function updateDraftLineUI() {
            document.getElementById('line-hint').innerText = `Кликай по карте, чтобы ставить точки линии (точек: ${draftLineCoords.length})`;
            if (draftPolyline) {
                draftPolyline.setLatLngs(draftLineCoords);
            } else if (draftLineCoords.length > 0) {
                draftPolyline = L.polyline(draftLineCoords, { color: '#00d4ff', weight: 3, dashArray: '6, 6' }).addTo(map);
            }
        }

        function onMapClickForLine(e) {
            var coord = [Number(e.latlng.lat.toFixed(6)), Number(e.latlng.lng.toFixed(6))];
            draftLineCoords.push(coord);
            var dot = L.circleMarker(e.latlng, { radius: 5, color: '#ffffff', fillColor: '#00d4ff', fillOpacity: 1, weight: 2 }).addTo(map);
            draftLineMarkers.push(dot);
            updateDraftLineUI();
        }

        function clearDraftLine() {
            draftLineCoords = [];
            if (draftPolyline) {
                map.removeLayer(draftPolyline);
                draftPolyline = null;
            }
            draftLineMarkers.forEach(function(m) { map.removeLayer(m); });
            draftLineMarkers = [];
            updateDraftLineUI();
        }

        function closeLineForm() {
            document.getElementById('line-form').classList.remove('open');
            map.off('click', onMapClickForLine);
            clearDraftLine();
            document.getElementById('line-name').value = '';
        }

        document.getElementById('draw-line-btn').addEventListener('click', function() {
            if (!isAdmin) return;
            var form = document.getElementById('line-form');
            if (form.classList.contains('open')) {
                closeLineForm();
            } else {
                closeAddForm();
                closeBottomSheet();
                form.classList.add('open');
                showToast('Кликай по карте, чтобы нарисовать маршрут');
                map.on('click', onMapClickForLine);
            }
        });

        document.getElementById('line-undo-btn').addEventListener('click', function() {
            if (draftLineCoords.length > 0) {
                draftLineCoords.pop();
                var lastDot = draftLineMarkers.pop();
                if (lastDot) map.removeLayer(lastDot);
                updateDraftLineUI();
            }
        });

        document.getElementById('line-clear-btn').addEventListener('click', clearDraftLine);
        document.getElementById('line-cancel-btn').addEventListener('click', closeLineForm);

        document.getElementById('line-save-btn').addEventListener('click', async function() {
            if (!isAdmin) return;
            var lineName = document.getElementById('line-name').value.trim() || 'Новый маршрут';
            if (draftLineCoords.length < 2) {
                showToast('Поставь минимум 2 точки на карте для маршрута!', true);
                return;
            }
            var btn = document.getElementById('line-save-btn');
            btn.disabled = true;
            btn.innerText = 'Сохранение...';

            const { error } = await db.from('locations').insert([{
                name: lineName,
                description: '',
                lat: draftLineCoords[0][0],
                lng: draftLineCoords[0][1],
                layer: 'Маршруты',
                geometry_type: 'LineString',
                coordinates: draftLineCoords
            }]);

            btn.disabled = false;
            btn.innerText = 'Сохранить маршрут';

            if (error) {
                showToast(`Ошибка: ${error.message}`, true);
            } else {
                showToast('Маршрут сохранён!');
                closeLineForm();
                loadData();
            }
        });

        /* --- УДАЛЕНИЕ ТОЧКИ / МАРШРУТА --- */
        window.deletePoint = async function(id) {
            if (!isAdmin) return;
            if (confirm('Точно удалить этот объект?')) {
                const { error } = await db.from('locations').delete().eq('id', id);
                if (error) {
                    showToast(`Ошибка при удалении: ${error.message}`, true);
                } else {
                    map.closePopup();
                    closeBottomSheet();
                    if (markerStore[id]) {
                        Object.values(clusterGroups).forEach(function(g) {
                            if (g.hasLayer(markerStore[id])) g.removeLayer(markerStore[id]);
                        });
                        delete markerStore[id];
                    }
                    showToast('Объект удалён!');
                    loadData();
                }
            }
        };
    </script>
</body>
</html>
